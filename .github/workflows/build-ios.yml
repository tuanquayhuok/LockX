name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: 📱 Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: 📲 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🏗️ Build iOS app (unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace LockX.xcworkspace \
            -scheme LockX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/LockX.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: 📦 Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LockX.xcarchive/Products/Applications/LockX.app build/Payload/
          cd build
          zip -r -y LockX.ipa Payload
          rm -rf Payload

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockX-IPA
          path: build/LockX.ipa
          retention-days: 30

      - name: ✅ Done
        run: |
          echo "🎉 Build complete!"
          echo "📱 Download IPA from the Artifacts section above"
          echo "📲 Install via AltStore / Sideloadly / TrollStore"
