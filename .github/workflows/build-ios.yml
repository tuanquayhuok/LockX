name: Build iOS IPA

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 📱 Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Generate native iOS project
        run: |
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: 📲 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🏗️ Build iOS app (unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace LockX.xcworkspace \
            -scheme LockX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/LockX.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: 📦 Create IPA
        run: |
          APP_DIR="${{ github.workspace }}/build/LockX.xcarchive/Products/Applications/LockX.app"
          
          # Đảm bảo main.jsbundle luôn tồn tại trong app
          if [ ! -f "$APP_DIR/main.jsbundle" ] || [ ! -s "$APP_DIR/main.jsbundle" ]; then
            echo "⚠️ main.jsbundle chưa có trong LockX.app! Tiến hành đóng gói bundle JavaScript trực tiếp..."
            npx expo export:embed \
              --platform ios \
              --dev false \
              --reset-cache \
              --entry-file index.ts \
              --bundle-output "$APP_DIR/main.jsbundle" \
              --assets-dest "$APP_DIR"
          else
            echo "✅ main.jsbundle đã được tạo bởi xcodebuild."
          fi

          echo "🔍 Kiểm tra tệp main.jsbundle:"
          ls -lh "$APP_DIR/main.jsbundle"

          echo "🔏 Thực hiện ký mã Ad-hoc (Ad-hoc signature) để iOS dyld cho phép nạp bộ nhớ..."
          codesign --force --deep --sign - "$APP_DIR"

          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -r -y LockX.ipa Payload
          rm -rf Payload

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockX-IPA
          path: build/LockX.ipa
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.2' }}
          name: "LockX ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.2' }} - Bản Cài Đặt Trực Tiếp (.IPA)"
          body: |
            ## 📱 LockX iOS - Bản Cài Đặt Trực Tiếp (.IPA)
            - **Tải trực tiếp**: Tệp `LockX.ipa` đính kèm bên dưới (cài qua Scarlet / TrollStore / AltStore / Sideloadly / Esign).
            - **Tính năng mới**:
              - Nâng cấp đồng hồ Speedtest mượt mà, chuyển giao Upload mượt mà không bị tụt sốc.
              - Hiệu ứng Mini Player đĩa than (Vinyl) xoay 360 độ theo điệu nhạc.
              - Tích hợp công cụ kiểm thử mạng HIHI: hỗ trợ CURL -I xem domain headers, tối ưu động cơ kết nối TCP socket.
              - Tối ưu hiệu năng cao, giảm giật khung hình và hỗ trợ Dark/Light mode.
          files: build/LockX.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Done
        run: |
          echo "🎉 Build and Release complete!"
          echo "📱 Release page: https://github.com/tuanquayhuok/LockX/releases"

